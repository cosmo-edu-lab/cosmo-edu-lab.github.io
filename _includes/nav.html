<header class="site-nav">
  <div class="nav-inner">
    <a class="brand brand-uni" href="{{ '/' | relative_url }}" aria-label="{{ site.title }}">
      <img class="brand-logo brand-logo-uni" src="{{ '/assets/images/Logo_A_Positivo_Colore.jpg' | relative_url }}" alt="Logo Università">
    </a>

    <button class="nav-toggle" id="navToggle" aria-label="Toggle menu" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>

    <nav class="nav-links" id="navLinks">
      {% for item in site.nav %}
        {% assign item_path = item.url | relative_url %}
        <a href="{{ item_path }}"{% if page.url == item.url %} class="active" aria-current="page"{% endif %}>{{ item.title }}</a>
      {% endfor %}
    </nav>

    <a class="brand brand-cosmo" href="{{ '/' | relative_url }}" aria-label="{{ site.title }}">
      <img class="brand-logo" src="{{ '/assets/images/CosmoEduLabLogo.png' | relative_url }}" alt="{{ site.title }}">
    </a>
  </div>
</header>
